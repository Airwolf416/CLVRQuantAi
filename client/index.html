<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050709" />
    <meta name="description" content="CLVRQuant — AI-Powered Market Intelligence Dashboard for Crypto, Stocks, Metals & Forex" />
    <meta property="og:title" content="CLVRQuant | Trade Smarter with AI" />
    <meta property="og:description" content="Live market data, AI analysis, macro calendar, and trading signals in one luxury dashboard." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CLVRQuant" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>CLVRQuant | Trade Smarter with AI</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #050709; font-family: 'Barlow', system-ui, sans-serif; color: #c8d4ee; }
      html[data-theme="light"] body { background: #f0f2f5; color: #0d1321; }
    </style>
    <script>
      try {
        const light = localStorage.getItem("clvr_theme") === "light";
        document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
        document.documentElement.classList.toggle("light-mode", light);
        if (light) document.querySelector('meta[name="theme-color"]').content = "#f0f2f5";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root">
      <div role="status" aria-live="polite" style="min-height:100vh;display:grid;place-content:center;text-align:center;gap:14px;padding:24px">
        <strong style="font-family:Georgia,serif;font-size:27px;color:#a07820">CLVRQuant</strong>
        <div>Loading your dashboard…</div>
        <progress aria-label="Loading dashboard" style="width:180px;margin:auto"></progress>
        <noscript>Enable JavaScript to open your dashboard.</noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
