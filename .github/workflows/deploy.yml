name: Read-only morning email diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and validate Railway CLI
        run: |
          set -euo pipefail
          npm install -g @railway/cli@5.71.0 --allow-scripts=@railway/cli --foreground-scripts
          version="$(railway --version)"
          [[ "$version" =~ railway[[:space:]]+5\.71\.0 ]]
      - name: Read sanitized morning email diagnostics
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          python scripts/brief-email-diagnostics.py --self-test
          python scripts/brief-email-diagnostics.py --current
          sleep 90
          python scripts/brief-email-diagnostics.py --current
          sleep 90
          python scripts/brief-email-diagnostics.py --current
