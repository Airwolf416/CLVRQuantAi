name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub forces JavaScript actions off Node.js 20 starting June 16 2026 and
  # removes the Node 20 runtime on Sept 16 2026. The Docker actions below do
  # not yet ship Node24-native major releases, so opt them in explicitly.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/airwolf416/clvrquantai:latest
            ghcr.io/airwolf416/clvrquantai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: |
          set -euo pipefail
          node --test scripts/verify-release.test.mjs
          npm install -g @railway/cli@5.71.0 --allow-scripts=@railway/cli --foreground-scripts
          version="$(railway --version)"
          printf '%s\n' "$version"
          [[ "$version" =~ railway[[:space:]]+5\.71\.0 ]]

      - name: Trigger Railway redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail
          test -n "$RAILWAY_TOKEN"
          test -n "$RAILWAY_SERVICE_ID"
          railway redeploy --service "$RAILWAY_SERVICE_ID" --yes

      - name: Verify the exact serving release
        timeout-minutes: 16
        run: node scripts/verify-release.mjs https://clvrquantai.com "${{ github.sha }}"
