[phases.setup]
nixPkgs = ["nodejs_22", "python311", "python311Packages.pip"]

# Python venv + quant deps in their own dedicated phase. Commands are
# byte-for-byte the same as before — only isolated into a named phase. The
# build phase dependsOn this so the venv is guaranteed present in the image;
# the start command runs it via /opt/venv/bin.
[phases.python]
dependsOn = ["setup"]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip && pip install -r quant/requirements.txt",
]

# Node deps in a DEDICATED install phase so the install no longer shares the
# build step's memory window. Use `npm ci` (not `npm install`): with this large
# dependency tree (googleapis, @solana/web3.js, sharp, full Radix UI suite),
# `npm install` re-resolves the whole tree and was OOM-killed mid-install
# ("npm error Exit handler never called!") on Railway's builder. `npm ci`
# installs deterministically from package-lock.json without the resolution pass,
# cutting peak memory. `--legacy-peer-deps` still proceeds past peer-dependency
# conflicts; `--include=dev` is required because NODE_ENV=production would
# otherwise omit the devDependencies (tsx/vite/typescript) the build needs.
# No `npm cache clean --force` (forces a cold re-extract that spikes peak
# memory). cacheDirectories warms the npm cache across builds for less IO/memory.
[phases.install]
dependsOn = ["setup"]
cacheDirectories = ["/root/.npm"]
cmds = [
  "npm ci --include=dev --legacy-peer-deps --no-audit --no-fund",
]

# Build runs AFTER both the node install and the python venv. Heap is capped
# via NODE_OPTIONS (scoped to the build only) so the tsx/vite build has enough
# memory without touching runtime memory.
[phases.build]
dependsOn = ["install", "python"]
cmds = [
  "ls node_modules/.bin/tsx",
  "NODE_OPTIONS=--max-old-space-size=4096 npm run build",
]

[start]
cmd = "PATH=/opt/venv/bin:$PATH npm start"

[variables]
NODE_ENV = "production"
PYTHONUNBUFFERED = "1"
