[phases.setup]
nixPkgs = ["nodejs_22", "python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip && pip install -r quant/requirements.txt",
]

# Node deps + build run in a SINGLE RUN step so node_modules is guaranteed
# present when `npm run build` executes. Splitting install/build into separate
# layers let node_modules disappear between layers on Railway's builder.
# Use `npm install` (not `npm ci`) because the build phase mounts a cache at
# node_modules/.cache, and `npm ci` wipes node_modules wholesale which conflicts
# with that mountpoint.
[phases.build]
cmds = [
  "NODE_ENV=development npm install --include=dev --no-audit --no-fund && ls node_modules/.bin/tsx && npm run build",
]

[start]
cmd = "PATH=/opt/venv/bin:$PATH npm start"

[variables]
NODE_ENV = "production"
PYTHONUNBUFFERED = "1"
