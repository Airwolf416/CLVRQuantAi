[phases.setup]
nixPkgs = ["nodejs_22", "python311", "python311Packages.pip"]

# Python venv + quant deps in their own dedicated phase. Commands are
# byte-for-byte the same as before — only isolated into a named phase. The
# build phase dependsOn this so the venv is guaranteed present in the image;
# the start command runs it via /opt/venv/bin.
[phases.python]
dependsOn = ["setup"]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip && pip install -r quant/requirements.txt",
]

# Node deps in a DEDICATED install phase so `npm install` no longer shares the
# build step's memory window — the previous single-step install+build was
# OOM-killed ("Exit handler never called!") on Railway's builder. Use
# `npm install` (not `npm ci`) + `--legacy-peer-deps` to proceed past
# peer-dependency conflicts. No `npm cache clean --force` (it forces a cold
# re-extract that spikes peak memory). cacheDirectories warms the npm cache
# across builds for less IO/memory.
[phases.install]
dependsOn = ["setup"]
cacheDirectories = ["/root/.npm"]
cmds = [
  "npm install --include=dev --legacy-peer-deps --no-audit --no-fund",
]

# Build runs AFTER both the node install and the python venv. Heap is capped
# via NODE_OPTIONS (scoped to the build only) so the tsx/vite build has enough
# memory without touching runtime memory.
[phases.build]
dependsOn = ["install", "python"]
cmds = [
  "ls node_modules/.bin/tsx",
  "NODE_OPTIONS=--max-old-space-size=4096 npm run build",
]

[start]
cmd = "PATH=/opt/venv/bin:$PATH npm start"

[variables]
NODE_ENV = "production"
PYTHONUNBUFFERED = "1"
